# Converts uploaded slide decks (.ppt/.pptx/.pps/.ppsx) to PDF so the app can
# show them in its own PDF viewer (migration 0146 in sunstone-builders).
# Triggered right after a publish (the API sends repository_dispatch
# 'convert-decks'), plus a 5-minute schedule (the main trigger when no dispatch token is set). Each run
# converts everything queued (convert_status = 'pending'), then exits.
#
# Secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY.
name: Convert decks to PDF

on:
  repository_dispatch:
    types: [convert-decks]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

concurrency:
  group: convert-decks
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Anything queued?
        id: queue
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          n=$(curl -sS "$SUPABASE_URL/rest/v1/project_artifacts?select=id&convert_status=eq.pending&storage_path=not.is.null&limit=1" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" | grep -c '"id"' || true)
          echo "pending=$n" >> "$GITHUB_OUTPUT"
          echo "pending: $n"

      - name: Install LibreOffice and fonts
        if: steps.queue.outputs.pending != '0'
        run: bash scripts/install-deck-fonts.sh

      - uses: actions/setup-node@v4
        if: steps.queue.outputs.pending != '0'
        with:
          node-version: '22'

      - name: Convert
        if: steps.queue.outputs.pending != '0'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/convert-decks.mjs
