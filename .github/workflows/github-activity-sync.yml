# Daily platform activity sync (GitHub, LeetCode, Codeforces — the adapter
# registry in api/_lib/activity-adapters.ts) for the Builder Page heatmap and
# hero stats — same free-cron pattern as hof-scoring.yml (Render Cron Jobs are
# paid; a GitHub Actions schedule firing one HTTP request costs nothing).
name: Platform activity sync (daily)

on:
  schedule:
    # 03:00 IST daily = 21:30 UTC the previous day.
    - cron: '30 21 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Run platform activity sync
        run: |
          response=$(curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            https://sunstone-builders.onrender.com/api/cron/platform-activity-sync)
          echo "$response"
          echo "$response" | grep -q '"ok":true' || exit 1
